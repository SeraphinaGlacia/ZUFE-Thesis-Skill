name: Publish latest release download

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build download endpoint
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release asset
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$EVENT_TAG"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi

          if [[ -z "$tag" ]]; then
            echo "Unable to resolve a published release tag." >&2
            exit 1
          fi

          asset_name="zufe-thesis-typesetter-${tag}.zip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Download published ZIP
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          downloaded=false
          for attempt in {1..6}; do
            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" \
              --dir release \
              --clobber; then
              downloaded=true
              break
            fi

            echo "Release asset is not available yet; retrying in 10 seconds (${attempt}/6)."
            sleep 10
          done

          if [[ "$downloaded" != "true" || ! -f "release/$ASSET_NAME" ]]; then
            echo "Expected release asset was not found: $ASSET_NAME" >&2
            exit 1
          fi

          unzip -t "release/$ASSET_NAME"

      - name: Build static download endpoint
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
          DOWNLOAD_NAME: zufe-thesis-typesetter-latest.zip
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          if [[ -d site ]]; then
            cp -a site/. _site/
          fi

          cp "release/$ASSET_NAME" "_site/$DOWNLOAD_NAME"
          touch _site/.nojekyll

          cmp --silent "release/$ASSET_NAME" "_site/$DOWNLOAD_NAME"
          unzip -t "_site/$DOWNLOAD_NAME"

          checksum="$(sha256sum "_site/$DOWNLOAD_NAME" | cut -d ' ' -f 1)"
          {
            echo "### Published download endpoint"
            echo ""
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Asset: \`$ASSET_NAME\`"
            echo "- Endpoint: \`/$DOWNLOAD_NAME\`"
            echo "- SHA-256: \`$checksum\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy download endpoint
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
