[project]
name = "zufe-thesis-skill-dev"
version = "0.0.0"
description = "Repository-local tooling for ZUFE Thesis Skill scripts"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.2.0",
]

[dependency-groups]
lint = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false
default-groups = ["lint", "test"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "N", "RUF100", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"zufe-thesis-typesetter/tests/*.py" = ["N802"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=zufe-thesis-typesetter/scripts",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
pythonpath = ["zufe-thesis-typesetter/scripts"]
testpaths = ["zufe-thesis-typesetter/tests"]

[tool.coverage.run]
branch = true
source = ["zufe-thesis-typesetter/scripts"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

[tool.ty.src]
include = ["zufe-thesis-typesetter/scripts"]
exclude = ["zufe-thesis-typesetter/tests"]
